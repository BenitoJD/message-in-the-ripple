[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-in-the-ripple"
version = "0.1.0"
description = "Transient caustic glyphs assembled by free water-wave propagation from a single finite launch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benito JD" }]
keywords = ["caustics", "water waves", "inverse design", "differentiable simulation", "physical rendering"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "matplotlib>=3.7",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/BenitoJD/message-in-the-ripple"

[tool.setuptools]
packages = ["ripple"]
